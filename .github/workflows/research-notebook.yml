name: Research notebook gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  research-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require dated research notebook entry
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_research_notebook.py
      - name: Run synthetic and existing unit tests
        run: python3 -m unittest discover -s tests -v
