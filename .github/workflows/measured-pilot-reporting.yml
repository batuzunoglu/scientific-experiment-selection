name: Measured pilot reporting

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  reporting:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/measured-pilot-mpl
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional pinned plotting dependencies
        run: python -m pip install -r requirements/figures.txt
      - name: Require plotting support
        run: python -c "import matplotlib; assert matplotlib.__version__ == '3.10.7'"
      - name: Test reporting from synthetic fixtures and public aggregates only
        run: python -m unittest discover -s tests -v
      - name: Render published aggregates without models or private sources
        run: python scripts/plot_measured_pilot_results.py --figure-dir /tmp/pilot-report-figures --result-dir /tmp/pilot-report-tables
      - name: Verify CSV and summary tables are reproducible
        run: |
          cmp docs/results/measured_pilot_plot_data.csv /tmp/pilot-report-tables/measured_pilot_plot_data.csv
          cmp docs/results/measured_pilot_summary.csv /tmp/pilot-report-tables/measured_pilot_summary.csv
          cmp docs/results/measured_pilot_summary.md /tmp/pilot-report-tables/measured_pilot_summary.md
