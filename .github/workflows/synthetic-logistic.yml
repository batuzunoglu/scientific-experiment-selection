name: Synthetic Logistic Regression

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  synthetic-logistic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned optional synthetic ML dependencies
        run: python -m pip install -r requirements/logistic.txt
      - name: Require exact ML dependency pins
        run: python -c "from scientific_experiment_selection.logistic import dependency_versions; print(dependency_versions())"
      - name: Run complete synthetic test suite with ML integration enabled
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v
      - name: Execute fixed synthetic B-arm budget curves
        run: python -m scientific_experiment_selection.logistic_demo --arm B --budget 12 --seeds 7 11 19
